<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Novel Reader</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root { --bg:#111; --fg:#ddd; --panel:#1e1e1e; --border:#444; --accent:#2b5c8f;
          --fs:20px; --lh:1.8; --ps:0.8em; --mx:24px; --font:Georgia,'Noto Serif Thai',serif; }
  body.sepia { --bg:#f4ecd8; --fg:#3b2f1e; --panel:#e8dec4; --border:#c9b98f; }
  body.light { --bg:#fff; --fg:#222; --panel:#eee; --border:#ccc; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: sans-serif;
         display: flex; flex-direction: column; overflow: hidden; }
  #top { display: flex; gap: 8px; padding: 8px; background: var(--panel); flex-wrap: wrap; align-items: center; }
  #top input[type=text] { flex: 1; min-width: 180px; padding: 6px; background: var(--bg); color: var(--fg);
                          border: 1px solid var(--border); border-radius: 4px; }
  button, select { padding: 6px 12px; cursor: pointer; background: var(--bg); color: var(--fg);
                   border: 1px solid var(--border); border-radius: 4px; }
  #stage { flex: 1; position: relative; min-height: 0; padding: 16px var(--mx) 8px; }
  #viewport { width: 100%; height: 100%; overflow: hidden; position: relative; }
  #book { height: 100%; font-family: var(--font); font-size: var(--fs); line-height: var(--lh);
          transition: transform .25s ease; will-change: transform; text-align: justify; hyphens: auto; }
  #book h2 { font-size: 1.3em; margin: 0 0 .2em; text-align: center; line-height: 1.3; }
  #book .story { text-align: center; opacity: .6; font-size: .8em; margin: 0 0 1em; }
  #book p { margin: 0 0 var(--ps); overflow-wrap: anywhere; }
  #msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
         text-align: center; opacity: .7; pointer-events: none; padding: 20px; }
  .zone { position: absolute; top: 0; bottom: 0; z-index: 2; }
  #zl { left: 0; width: 30%; } #zc { left: 30%; width: 40%; } #zr { right: 0; width: 30%; }
  #bar { padding: 6px 10px; text-align: center; background: var(--panel); font-size: 13px;
         display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #progress { height: 3px; background: var(--accent); width: 0; transition: width .2s; }
  #settings { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--border);
              padding: 12px 14px calc(12px + env(safe-area-inset-bottom)); z-index: 10; display: none;
              grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px 20px; font-size: 14px; }
  #settings.open { display: grid; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row > span:first-child { width: 90px; flex: none; }
  .row .val { width: 48px; text-align: center; flex: none; }
  .row input[type=range] { flex: 1; }
  body.hide-ui #top, body.hide-ui #bar { display: none; }
</style>
</head>
<body>
<form id="top">
  <button type="button" id="homeBtn" title="เปิดลิงก์ในแท็บใหม่">🏠</button>
  <input type="text" id="url" placeholder="URL หน้าตอนนิยาย" required>
  <button>โหลด</button>
  <button type="button" id="prevch">◀ ตอนก่อน</button>
  <button type="button" id="nextch">ตอนถัดไป ▶</button>
  <button type="button" id="setBtn" title="ตั้งค่าตัวอักษร">Aa</button>
  <button type="button" id="fs" title="เต็มจอ (F)">⛶</button>
</form>
<div id="progress"></div>
<div id="stage">
  <div id="viewport"><div id="book"></div></div>
  <div id="msg">ใส่ URL แล้วกด "โหลด"</div>
  <div class="zone" id="zl" title="หน้าก่อนหน้า"></div>
  <div class="zone" id="zc" title="แตะกลางจอ = แสดง/ซ่อนเมนู"></div>
  <div class="zone" id="zr" title="หน้าถัดไป"></div>
</div>
<div id="bar"><span id="pos"></span><span>แตะ/ปัด ซ้าย-ขวา เพื่อเปลี่ยนหน้า • แตะกลาง = เมนู</span></div>

<div id="settings">
  <div class="row"><span>ขนาดตัวอักษร</span><button type="button" data-k="fs" data-d="-1">A−</button>
    <input type="range" id="r_fs" min="12" max="40" step="1"><button type="button" data-k="fs" data-d="1">A+</button><span class="val" id="v_fs"></span></div>
  <div class="row"><span>ช่องไฟบรรทัด</span><button type="button" data-k="lh" data-d="-1">−</button>
    <input type="range" id="r_lh" min="1.2" max="3" step="0.1"><button type="button" data-k="lh" data-d="1">+</button><span class="val" id="v_lh"></span></div>
  <div class="row"><span>ช่องว่างย่อหน้า</span><button type="button" data-k="ps" data-d="-1">−</button>
    <input type="range" id="r_ps" min="0" max="2.5" step="0.1"><button type="button" data-k="ps" data-d="1">+</button><span class="val" id="v_ps"></span></div>
  <div class="row"><span>ขอบข้าง</span><button type="button" data-k="mx" data-d="-1">−</button>
    <input type="range" id="r_mx" min="0" max="120" step="4"><button type="button" data-k="mx" data-d="1">+</button><span class="val" id="v_mx"></span></div>
  <div class="row"><span>ธีม</span>
    <select id="theme"><option value="dark">มืด</option><option value="sepia">ซีเปีย</option><option value="light">สว่าง</option></select>
    <select id="font"><option value="Georgia,'Noto Serif Thai',serif">Serif</option>
      <option value="system-ui,'Noto Sans Thai',sans-serif">Sans</option></select></div>
  <div class="row"><button type="button" id="resetSet">รีเซ็ต</button><button type="button" id="closeSet">ปิด</button></div>
</div>

<script>
const $ = id => document.getElementById(id);
const DEF = { fs: 20, lh: 1.8, ps: 0.8, mx: 24, theme: "dark", font: "Georgia,'Noto Serif Thai',serif" };
const LIM = { fs: [12, 40, 1], lh: [1.2, 3, 0.1], ps: [0, 2.5, 0.1], mx: [0, 120, 4] };
const UNIT = { fs: "px", lh: "", ps: "em", mx: "px" };
let S = { ...DEF, ...JSON.parse(localStorage.getItem("novelSettings") || "{}") };
let data = null, page = 0, pages = 1, step = 0, GAP = 48;

function applySettings(keepRatio = true) {
  const ratio = keepRatio && pages > 1 ? page / (pages - 1) : 0;
  const r = document.documentElement.style;
  r.setProperty("--fs", S.fs + "px"); r.setProperty("--lh", S.lh);
  r.setProperty("--ps", S.ps + "em"); r.setProperty("--mx", S.mx + "px");
  r.setProperty("--font", S.font);
  document.body.className = S.theme === "dark" ? "" : S.theme;
  for (const k of Object.keys(LIM)) {
    $("r_" + k).value = S[k];
    $("v_" + k).textContent = (k === "lh" || k === "ps" ? (+S[k]).toFixed(1) : S[k]) + UNIT[k];
  }
  $("theme").value = S.theme; $("font").value = S.font;
  localStorage.setItem("novelSettings", JSON.stringify(S));
  layout(ratio);
}

// แบ่งหน้าแบบ e-book ด้วย CSS columns: 1 คอลัมน์ = 1 หน้า แล้วเลื่อนทีละหน้า
function layout(ratio = 0) {
  const vp = $("viewport"), book = $("book");
  const w = vp.clientWidth;
  if (!w || !data) return;
  GAP = Math.max(24, Math.min(64, S.mx));
  book.style.transition = "none";
  book.style.width = w + "px";
  book.style.columnWidth = w + "px";
  book.style.columnGap = GAP + "px";
  book.style.columnFill = "auto";
  step = w + GAP;
  pages = Math.max(1, Math.round((book.scrollWidth + GAP) / step));
  page = ratio === "last" ? pages - 1 : Math.min(pages - 1, Math.round(ratio * (pages - 1)));
  show();
  requestAnimationFrame(() => book.style.transition = "");
}

function show() {
  $("book").style.transform = `translateX(${-page * step}px)`;
  $("pos").textContent = data ? `หน้า ${page + 1}/${pages}` : "";
  $("progress").style.width = pages > 1 ? (page / (pages - 1)) * 100 + "%" : "100%";
  if (data) localStorage.setItem("novelPos:" + data.url, page / Math.max(1, pages - 1));
}

function turn(d) {
  const n = page + d;
  if (n >= 0 && n < pages) { page = n; show(); }
  else if (n >= pages) gotoChapter("next");
  else gotoChapter("prev", "last");
}

async function gotoChapter(which, startAt = 0) {
  if (!data || !data[which]) { $("msg").textContent = which === "next" ? "ไม่มีตอนถัดไป" : "ไม่มีตอนก่อนหน้า"; flash(); return; }
  $("url").value = data[which];
  await load(startAt);
}
function flash() { $("msg").style.display = "flex"; setTimeout(() => { if (data) $("msg").style.display = "none"; }, 1200); }

async function fetchText(u) {
  const r = await fetch("/text?" + new URLSearchParams({ url: u }));
  if (!r.ok) throw new Error((await r.json()).detail || r.status);
  return r.json();
}
const prefetched = new Set();
function prefetch(u) { if (u && !prefetched.has(u)) { prefetched.add(u); fetchText(u).catch(() => prefetched.delete(u)); } }

async function load(startAt = null) {
  const u = $("url").value.trim();
  if (!u) return;
  $("msg").textContent = "กำลังโหลด..."; $("msg").style.display = "flex";
  try {
    data = await fetchText(u);
    const book = $("book");
    book.innerHTML = "";
    if (data.story_title) { const s = document.createElement("div"); s.className = "story"; s.textContent = data.story_title; book.appendChild(s); }
    if (data.title) { const h = document.createElement("h2"); h.textContent = data.title; book.appendChild(h); }
    for (const t of data.paragraphs) { const p = document.createElement("p"); p.textContent = t; book.appendChild(p); }
    document.title = data.title || "Novel Reader";
    $("msg").style.display = "none";
    if (startAt === null) startAt = parseFloat(localStorage.getItem("novelPos:" + u)) || 0;
    page = 0;
    layout(startAt);
    localStorage.setItem("novelLast", u);
    history.replaceState(null, "", "?" + new URLSearchParams({ url: u }));
    if (!data.rendered) prefetch(data.next); // เว็บที่ต้องเรนเดอร์ด้วยเบราว์เซอร์: ดึงทีละตอนตามที่กดอ่านเท่านั้น
  } catch (e) {
    data = null; $("book").innerHTML = ""; show();
    $("msg").textContent = "ผิดพลาด: " + e.message;
  }
}

// ---- events ----
$("zl").onclick = () => turn(-1);
$("zr").onclick = () => turn(1);
$("zc").onclick = () => document.body.classList.toggle("hide-ui");
$("top").onsubmit = e => { e.preventDefault(); load(); };
$("prevch").onclick = () => gotoChapter("prev");
$("nextch").onclick = () => gotoChapter("next");
$("homeBtn").onclick = () => { const u = $("url").value.trim(); window.open(u || "/novels", "_blank", "noopener"); };
$("setBtn").onclick = () => $("settings").classList.toggle("open");
$("closeSet").onclick = () => $("settings").classList.remove("open");
$("resetSet").onclick = () => { S = { ...DEF }; applySettings(); };
function toggleFs() { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); }
$("fs").onclick = toggleFs;

document.querySelectorAll("[data-k]").forEach(b => b.onclick = () => {
  const k = b.dataset.k, [mn, mx, st] = LIM[k];
  S[k] = Math.min(mx, Math.max(mn, +(+S[k] + b.dataset.d * st).toFixed(2)));
  applySettings();
});
for (const k of Object.keys(LIM)) $("r_" + k).oninput = e => { S[k] = +e.target.value; applySettings(); };
$("theme").onchange = e => { S.theme = e.target.value; applySettings(); };
$("font").onchange = e => { S.font = e.target.value; applySettings(); };

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); turn(1); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); turn(-1); }
  else if (e.key === "f" || e.key === "F") toggleFs();
  else if (e.key === "+" || e.key === "=") { S.fs = Math.min(40, S.fs + 1); applySettings(); }
  else if (e.key === "-") { S.fs = Math.max(12, S.fs - 1); applySettings(); }
});

// swipe: ปัดซ้าย = หน้าถัดไป, ปัดขวา = หน้าก่อนหน้า (ทั้งทัชและเมาส์)
let sx = 0, sy = 0, st = 0, swiped = false;
const stage = $("stage");
stage.addEventListener("touchstart", e => { const t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; st = Date.now(); }, { passive: true });
stage.addEventListener("touchend", e => {
  const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.5 && Date.now() - st < 800) {
    swiped = true; setTimeout(() => swiped = false, 350);
    turn(dx < 0 ? 1 : -1);
  }
}, { passive: true });
// ป้องกัน click ที่ตามมาหลัง swipe ไม่ให้เปลี่ยนหน้าซ้ำ
stage.addEventListener("click", e => { if (swiped) { e.stopPropagation(); e.preventDefault(); } }, true);

let rt;
window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => applySettings(), 150); });

applySettings(false);
const qs = new URLSearchParams(location.search);
$("url").value = qs.get("url") || localStorage.getItem("novelLast") || "";
if (qs.get("url")) load();
</script>
</body>
</html>
