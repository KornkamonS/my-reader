<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manga Reader</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #111; color: #eee; font-family: sans-serif;
         height: 100vh; display: flex; flex-direction: column; }
  form { display: flex; gap: 8px; padding: 8px; background: #1e1e1e; flex-wrap: wrap; align-items: center; }
  input[type=text], select { padding: 6px; background: #2a2a2a; color: #eee; border: 1px solid #444; border-radius: 4px; }
  #url { flex: 1; min-width: 220px; }
  #groupSelect { max-width: 280px; font-size: 13px; font-weight: bold; background: #1a3045; border-color: #2b5c8f; }
  #pattern { width: 130px; }
  button { padding: 6px 12px; cursor: pointer; }
  #viewer { flex: 1; display: flex; flex-direction: row-reverse; /* ขวา -> ซ้าย */
            justify-content: center; align-items: center; min-height: 0; position: relative; user-select: none; }
  #viewer img { max-width: 50%; max-height: 100%; object-fit: contain; }
  #viewer.single img { max-width: 100%; }
  .zone { position: absolute; top: 0; bottom: 0; width: 50%; cursor: pointer; }
  #next { left: 0; }   /* กดฝั่งซ้าย = หน้าถัดไป */
  #prev { right: 0; }  /* กดฝั่งขวา = ย้อนกลับ */
  #msg { position: absolute; color: #aaa; }
  #bar { padding: 6px; text-align: center; background: #1e1e1e; font-size: 14px; display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; }
  #pageToggle { padding: 3px 10px; font-size: 13px; background: #2b5c8f; color: #fff; border: 1px solid #3d7ab8; border-radius: 4px; }
  #pageToggle:hover { background: #366fa8; }
  label { font-size: 13px; }
  /* โหมดเต็มจอ: ซ่อนแถบควบคุมให้ภาพใหญ่สุด (กด Esc หรือ F เพื่อออก) */
  :fullscreen form, :fullscreen #bar { display: none; }
</style>
</head>
<body>
<form id="form">
  <input type="text" id="url" placeholder="URL หน้าตอนมังงะ" required>
  <select id="groupSelect" style="display: none;" title="ตัวกรองกลุ่มรูปภาพ"></select>
  <input type="text" id="pattern" placeholder="กรอง URL (regex)">
  <select id="defaultMode" title="โหมดแสดงผลเริ่มต้น">
    <option value="double">เริ่มต้น: หน้าคู่</option>
    <option value="single">เริ่มต้น: หน้าเดี่ยว</option>
  </select>
  <label><input type="checkbox" id="cover" checked> หน้าแรกเดี่ยว</label>
  <label><input type="checkbox" id="proxy" checked> โหลดผ่านเซิร์ฟเวอร์</label>
  <button>โหลด</button>
  <button type="button" id="prevch" title="ไปตอนก่อนหน้า">◀ ตอนก่อนหน้า</button>
  <button type="button" id="nextch" title="ไปตอนถัดไป">ตอนถัดไป ▶</button>
  <button type="button" id="fs" title="เต็มจอ (กด F)">⛶ เต็มจอ</button>
</form>
<div id="viewer"><span id="msg">ใส่ URL แล้วกด "โหลด"</span>
  <div class="zone" id="next" title="หน้าถัดไป"></div>
  <div class="zone" id="prev" title="ย้อนกลับ"></div>
</div>
<div id="bar">
  <span>← กดฝั่งซ้าย/ปุ่ม ← = ถัดไป &nbsp;|&nbsp; กดฝั่งขวา/ปุ่ม → = ย้อนกลับ</span>
  <span>|</span>
  <span id="pos"></span>
  <button type="button" id="pageToggle" style="display: none;" title="สลับหน้าเดี่ยว/หน้าคู่สำหรับหน้านี้ (กด S หรือ Space)"></button>
</div>

<script>
const $ = id => document.getElementById(id);
let pages = [], spreads = [], cur = 0, initCur = 0;
let allImages = [], detectedGroups = [];
// เก็บการตั้งค่าหน้าเดี่ยว (1) หรือหน้าคู่ (2) ของแต่ละ index หน้า (เช่น { 0: 1, 5: 1 })
let pageModes = {};

// เรียงตามเลขท้ายชื่อไฟล์ (natural sort): _2 มาก่อน _10
const natural = (a, b) => a.localeCompare(b, undefined, { numeric: true });

function extractGroupsClient(images) {
  const grps = {};
  for (const item of images) {
    const u = typeof item === "string" ? item : item.url;
    try {
      const urlObj = new URL(u);
      const p = urlObj.pathname;
      const m = p.match(/^(.*?)(\d+)(\.[a-zA-Z0-9]+(?:[?#].*)?)$/);
      if (m) {
        const prefix = m[1];
        const namePart = prefix.replace(/\/$/, "").split("/").pop() || prefix;
        const cleanName = namePart.replace(/^[-_]+|[-_]+$/g, "") || namePart;
        const key = urlObj.origin + prefix + "*" + m[3];
        if (!grps[key]) grps[key] = { name: cleanName, pattern: cleanName, count: 0, sample: u, urls: [] };
        grps[key].count++;
        grps[key].urls.push(u);
      } else {
        const dir = p.substring(0, p.lastIndexOf("/") + 1);
        const dirName = dir.replace(/\/$/, "").split("/").pop() || "other";
        const key = urlObj.origin + dir;
        if (!grps[key]) grps[key] = { name: dirName, pattern: dirName, count: 0, sample: u, urls: [] };
        grps[key].count++;
        grps[key].urls.push(u);
      }
    } catch (e) {}
  }
  return Object.values(grps).sort((a, b) => b.count - a.count);
}

function updateGroupDropdown(groups, totalCount) {
  const sel = $("groupSelect");
  sel.innerHTML = "";

  if (!groups || groups.length <= 1) {
    sel.style.display = "none";
    return;
  }

  sel.style.display = "inline-block";

  // ตัวเลือกกลุ่มหลัก (กลุ่มที่มีจำนวนรูปมากที่สุด)
  const mainGrp = groups[0];
  const mainOpt = document.createElement("option");
  mainOpt.value = "group:0";
  mainOpt.textContent = `⭐ กลุ่มหลัก: ${mainGrp.name} (${mainGrp.count} หน้า)`;
  sel.appendChild(mainOpt);

  // ตัวเลือกกลุ่มอื่นๆ ที่มีรูปมากกว่า 0
  groups.slice(1).forEach((g, idx) => {
    if (g.count > 0) {
      const opt = document.createElement("option");
      opt.value = `group:${idx + 1}`;
      opt.textContent = `กลุ่ม: ${g.name} (${g.count} รูป)`;
      sel.appendChild(opt);
    }
  });

  // ตัวเลือกแสดงทั้งหมด
  const allOpt = document.createElement("option");
  allOpt.value = "all";
  allOpt.textContent = `ทั้งหมด (${totalCount} รูป)`;
  sel.appendChild(allOpt);

  sel.value = "group:0";
}

function applyGroupSelection() {
  const sel = $("groupSelect");
  const val = sel.value;

  if (val.startsWith("group:") && detectedGroups.length) {
    const idx = parseInt(val.split(":")[1], 10);
    const grp = detectedGroups[idx];
    if (grp) {
      if (grp.urls && grp.urls.length) {
        pages = [...grp.urls].sort(natural);
      } else {
        pages = allImages
          .filter(u => u.includes(grp.pattern) || u.includes(grp.name))
          .sort(natural);
      }
      return;
    }
  }

  pages = [...allImages].sort(natural);
}

$("groupSelect").onchange = () => {
  applyGroupSelection();
  pageModes = {};
  cur = 0;
  buildSpreads();
  render();
};

function getSpreadStartIndex(spreadIdx) {
  let idx = 0;
  for (let k = 0; k < spreadIdx && k < spreads.length; k++) {
    idx += spreads[k].length;
  }
  return idx;
}

function getEffectiveMode(pageIndex) {
  if (pageModes[pageIndex] === 1 || pageModes[pageIndex] === 2) {
    return pageModes[pageIndex];
  }
  if (pageIndex === 0 && $("cover").checked) return 1;
  return $("defaultMode").value === "single" ? 1 : 2;
}

function buildSpreads(keepPageIndex = null) {
  if (keepPageIndex === null && spreads.length && cur < spreads.length) {
    keepPageIndex = getSpreadStartIndex(cur);
  }
  spreads = [];
  let i = 0;
  let newCur = 0;
  while (i < pages.length) {
    const startIdx = i;
    const mode = getEffectiveMode(i);
    const count = (mode === 1 || i + 1 >= pages.length) ? 1 : 2;
    spreads.push(pages.slice(i, i + count));
    if (keepPageIndex !== null && keepPageIndex >= startIdx && keepPageIndex < startIdx + count) {
      newCur = spreads.length - 1;
    }
    i += count;
  }
  if (keepPageIndex !== null) {
    cur = newCur;
  } else {
    cur = Math.min(cur, Math.max(spreads.length - 1, 0));
  }
}

function toggleCurrentPageMode() {
  if (!spreads.length) return;
  const startIdx = getSpreadStartIndex(cur);
  const currentLen = spreads[cur].length;
  // สลับระหว่าง 1 (หน้าเดี่ยว) กับ 2 (หน้าคู่: เอาภาพถัดไปมาต่อ)
  // กรณีอยู่หน้าสุดท้ายและมีแค่ 1 รูป แต่โหมดเป็น 2 อยู่แล้ว ให้สลับตามค่าโหมด
  const currentMode = getEffectiveMode(startIdx);
  const nextMode = (currentLen === 1 && currentMode === 1) ? 2 : 1;
  pageModes[startIdx] = nextMode;
  if (startIdx === 0) {
    $("cover").checked = (nextMode === 1);
  }
  buildSpreads(startIdx);
  render();
}

const src = u => $("proxy").checked ? "/proxy?url=" + encodeURIComponent(u) : u;

function render() {
  const v = $("viewer");
  v.querySelectorAll("img").forEach(e => e.remove());
  const toggleBtn = $("pageToggle");
  if (!spreads.length) {
    $("pos").textContent = "";
    toggleBtn.style.display = "none";
    return;
  }
  const s = spreads[cur];
  const startIdx = getSpreadStartIndex(cur);
  v.classList.toggle("single", s.length === 1);
  // row-reverse: รูปแรกใน DOM อยู่ขวาสุด (หน้าก่อนหน้าอยู่ขวา หน้าถัดไปอยู่ซ้าย)
  s.forEach(u => { const im = new Image(); im.src = src(u); v.appendChild(im); });
  // preload spread ถัดไป
  (spreads[cur + 1] || []).forEach(u => { new Image().src = src(u); });

  const pageLabel = s.length === 1
    ? `หน้า ${startIdx + 1}/${pages.length}`
    : `หน้า ${startIdx + 1}-${startIdx + s.length}/${pages.length}`;
  $("pos").textContent = `${pageLabel} (ชุด ${cur + 1}/${spreads.length})`;

  // อัปเดตปุ่มสลับหน้าเดี่ยว/หน้าคู่สำหรับหน้าปัจจุบัน
  toggleBtn.style.display = "inline-block";
  const isSingle = s.length === 1;
  const canPairNext = startIdx + 1 < pages.length;
  if (isSingle) {
    toggleBtn.textContent = canPairNext ? "📄 หน้าเดี่ยว (กดเพื่อต่อภาพถัดไปเป็นหน้าคู่)" : "📄 หน้าเดี่ยว (หน้าสุดท้าย)";
    toggleBtn.disabled = !canPairNext;
  } else {
    toggleBtn.textContent = "📖 หน้าคู่ (กดเพื่อแยกเป็นหน้าเดี่ยว)";
    toggleBtn.disabled = false;
  }

  // เก็บ URL + ตำแหน่งหน้าไว้ใน query string เพื่อ bookmark ได้
  const q = new URLSearchParams({ url: $("url").value });
  if (cur > 0) q.set("p", cur);
  history.replaceState(null, "", "?" + q);
}

const go = d => { const n = cur + d; if (n >= 0 && n < spreads.length) { cur = n; render(); } };
$("next").onclick = () => go(1);
$("prev").onclick = () => go(-1);
$("pageToggle").onclick = toggleCurrentPageMode;
function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
}
$("fs").onclick = toggleFullscreen;
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  if (e.key === "f" || e.key === "F") toggleFullscreen();
  if (e.key === "s" || e.key === "S" || e.key === " ") {
    e.preventDefault();
    toggleCurrentPageMode();
  }
  if (e.key === "ArrowLeft") go(1);
  if (e.key === "ArrowRight") go(-1);
});
$("cover").onchange = () => {
  delete pageModes[0];
  buildSpreads();
  render();
};
$("defaultMode").onchange = () => {
  pageModes = {};
  buildSpreads();
  render();
};
$("proxy").onchange = render;

async function loadChapter() {
  $("msg").textContent = "กำลังโหลด...";
  $("msg").style.display = "";
  try {
    const q = new URLSearchParams({ url: $("url").value });
    if ($("pattern").value.trim()) {
      q.set("pattern", $("pattern").value.trim());
    }
    const r = await fetch("/images?" + q);
    if (!r.ok) throw new Error((await r.json()).detail || r.status);
    const data = await r.json();

    allImages = (data.images || []).map(i => typeof i === "string" ? i : i.url);
    
    // ใช้ groups จาก backend ถ้ามี หรือประมวลผล client-side
    detectedGroups = data.groups && data.groups.length ? data.groups : extractGroupsClient(allImages);

    // อัปเดต dropdown สำหรับกรองกลุ่มรูป
    updateGroupDropdown(detectedGroups, allImages.length);

    // กรองและเรียงหน้า
    applyGroupSelection();

    if (!pages.length) throw new Error("ไม่พบรูป (ลองแก้ช่องกรอง URL)");
    pageModes = {};
    cur = Math.min(initCur, Math.max(pages.length - 1, 0));
    initCur = 0;
    buildSpreads(null);
    cur = Math.min(cur, Math.max(spreads.length - 1, 0));
    $("msg").style.display = "none";
    render();
    localStorage.setItem("lastUrl", $("url").value);
  } catch (err) {
    pages = []; spreads = []; render();
    $("msg").textContent = "ผิดพลาด: " + err.message;
  }
}

$("form").onsubmit = e => { e.preventDefault(); loadChapter(); };

const changeChapter = (endpoint, key, label) => async () => {
  if (!$("url").value) return;
  $("msg").textContent = "กำลังหา" + label + "...";
  $("msg").style.display = "";
  try {
    const r = await fetch("/" + endpoint + "?url=" + encodeURIComponent($("url").value));
    if (!r.ok) throw new Error((await r.json()).detail || r.status);
    $("url").value = (await r.json())[key];
    await loadChapter();
  } catch (err) {
    $("msg").textContent = "ผิดพลาด: " + err.message;
  }
};
$("nextch").onclick = changeChapter("next", "next", "ตอนถัดไป");
$("prevch").onclick = changeChapter("prev", "prev", "ตอนก่อนหน้า");

const qs = new URLSearchParams(location.search);
if (qs.get("url")) {
  $("url").value = qs.get("url");
  initCur = Math.max(0, parseInt(qs.get("p"), 10) || 0);
  loadChapter();
} else {
  $("url").value = localStorage.getItem("lastUrl") || "";
}
</script>
</body>
</html>
